  - title: "Addiction and Expression"
    year: 2020
    citation: "47 Hastings Const. L.Q. 197 (2020)"
    abstract: |
      Addictive products—such as tobacco, alcohol, and gambling—have been considered legitimate regulatory targets throughout American history and for thousands of years prior. Expressive products—such as newspapers, books, movies, and video games—have in the United States been considered essentially immune from content-based regulation, thanks to the First Amendment. But what if the content of an expressive product makes it addictive? Which tradition must give in: the ancient power of legislatures to protect society at large from the wide-ranging impacts of addiction, or the legal shield that has generated a thriving culture of artistic independence? This Article is the first to explore the question of how the First Amendment should treat intentionally addictive speech. Social research indicates that certain behavioral addictions premised on the compulsive use of expressive products—particularly video games and pornography—are real dysfunctions of the brain, explainable in part by the intentional choices of developers and producers to create addictive products. And regulators are beginning to unsteadily lurch into action, without any evidence that they are taking the First Amendment into account. This Article proposes that, under current doctrine, any such regulation must satisfy strict scrutiny. It then argues that, more fundamentally, intentionally addictive expression does not merit First Amendment coverage.
    links:
      - name: Journal
        url: "https://repository.uclawsf.edu/hastings_constitutional_law_quaterly/vol47/iss2/3/"
      - name: SSRN
        url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4898737"
      - name: Campbell Repository
        url: "https://scholarship.law.campbell.edu/exhibit/faculty-publications/luke-smith-morgan-assistant-professor-of-law/addiction-and-expression/"

  - title: "Doctrinal Dynamism, Borrowing, and the Relationship Between Rules and Rights"
    authors: "with Joseph Blocher"
    year: 2019
    citation: "28 Wm. & Mary Bill Rts. J. 319 (2019)"
    abstract: |
      The study of "Rights Dynamism," exemplified in Timothy Zick's new book on the First Amendment's relationship with the rest of the Bill of Rights, can enrich our understanding of constitutional rights. It also opens a door to another potentially fruitful arena: what we call "Doctrinal Dynamism." Constitutional rights often interact and generate new meanings and applications by way of importing and exporting one another's doctrinal rules, even when the rights themselves do not intersect directly in the context of a single case. Focusing on these doctrinal exchanges can illuminate the strengths and weaknesses of various rules, the specific interests underlying different constitutional guarantees, and the sometimes inextricable relationship between particular rights and their constitutive doctrines. In this Article, we explore the definitional challenge—what is doctrine?—before identifying some lessons learned when doctrine migrates between rights and when it stays home.
    links:
      - name: Journal
        url: "https://scholarship.law.wm.edu/wmborj/vol28/iss2/4/"
      - name: SSRN
        url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4898735"
