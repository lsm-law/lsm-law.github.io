  - title: "The Broken Branch: Capitalism, the Constitution, and the Press"
    year: 2020
    citation: "125 Penn St. L. Rev. 1 (2020)"
    abstract: |
      The First Amendment to the Constitution guarantees "freedom ... of the press," an explicit textual recognition of what the founding generation, informed by their immediate historical experience, frequently hailed as the most important political liberty—the "bulwark" upon which all other freedoms relied. From this fertile intellectual and legal soil, cultivated by generous subsidies, a thriving and vibrant institutional press emerged as an undeniable asset to American civil society. Today, that press is dying. Industry revenues have declined by more than 70% in the last two decades, leaving tens of thousands of journalists without jobs and millions of Americans without meaningful access to quality journalism. The reason for this media apocalypse is simple: America has assigned to the free market the task of producing an adequate supply of a public good, with most of its value lying in externalities, that cannot be made profitable to the extent that it is desirable. As a result, American journalism is in a market-induced death spiral.

      This Article argues that, given the Framers' correct understanding that a sustainable, powerful institutional press is a precondition to representative government, the market-driven collapse of the press is a constitutional crisis.
    cited_in:
      - text: "RonNell Andersen Jones & Sonja R. West eds., *The Future of Press Freedom* (Cambridge Univ. Press 2025)"
        url: "https://www.cambridge.org/core/books/future-of-press-freedom/842C61CE63FEC39BB762FCFD421EE33B"
