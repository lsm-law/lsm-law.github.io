    slug: civil-procedure
    terms: "Fall 2025, Spring 2026, Fall 2026"
    description: "Civil procedure is really the combination of two separate but related courses. First, civil procedure teaches the fundamentals of the adjudicative process in the United States. Second, the course is also about the organization of the American judicial system and how the federal-state structure shapes civil litigation."
