<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-links">
      <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
      {{- range site.Params.profiles }} <span aria-hidden="true">·</span> <a href="{{ .url }}">{{ .name }}</a>{{ end }}
    </p>
    <p class="footer-meta">
      <span>© {{ now.Year }} {{ site.Params.name }}. Updated {{ site.Params.updated }}.</span>
      {{- if site.Params.mysite.credit }}
      <span class="credit">Created using <a href="https://garyking.org/mysite">GaryKing.org/mysite</a></span>
      {{- end }}
    </p>
  </div>
</footer>
