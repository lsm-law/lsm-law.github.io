<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Params.name }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Menu</span>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        {{- $active := and .Page (eq .Page.RelPermalink $current.RelPermalink) }}
        <li><a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
